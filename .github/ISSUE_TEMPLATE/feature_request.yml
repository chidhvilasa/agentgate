name: Feature request
description: Propose a new capability or improvement for AgentGate.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For anything touching policy evaluation, redaction, the audit chain, or the
        Control API's security model, please also skim [docs/THREAT_MODEL.md](../../docs/THREAT_MODEL.md) and
        [docs/ARCHITECTURE.md](../../docs/ARCHITECTURE.md) — noting how your idea fits (or changes) the existing
        trust boundaries speeds up review a lot.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What can't you do today, or what's awkward/unsafe today, that this would fix?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: security
    attributes:
      label: Security / threat-model impact
      description: Does this touch policy evaluation, redaction, the audit chain, agent identity, or the Control API?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
