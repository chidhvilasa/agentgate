name: Bug report
description: Something in AgentGate isn't working as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Please redact any real secrets, tokens, file paths, or unredacted audit data
        before pasting logs below** — this issue will be public. See [SECURITY.md](../../SECURITY.md) instead if
        this is a security vulnerability rather than a functional bug.

  - type: input
    id: version
    attributes:
      label: AgentGate commit or version
      description: Output of `git rev-parse --short HEAD` in your checkout (or the release version once published).
      placeholder: "5070a2b"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other (describe in "Additional context")
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node -v`.
      placeholder: "v20.x.x"
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: MCP transport / protocol era involved
      options:
        - stdio (legacy 2025) — currently the only supported era
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The smallest policy file + command sequence that reproduces the issue. Prefer a diff against
        `policies/agentgate.example.yml` or `examples/agentgate.yml` over pasting a full unrelated policy.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs / output
      description: >
        Gateway stderr output, `agentgate audit verify` output, or browser console output — with any real
        credentials, tokens, or private file paths replaced with placeholders.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
